<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ideensammlung</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1f1f1c;--mu:#6b6a63;--bd:#dddbd2;--ac:#2f5d50;--acx:#fff;--er:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#171715;--card:#22221f;--tx:#eeede6;--mu:#a2a198;--bd:#3a3935;--ac:#7fc4af;--acx:#10211c;--er:#f2918a;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:0 0 8px}
.mu{color:var(--mu);font-size:14px}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:14px 0}
input,select,textarea{width:100%;box-sizing:border-box;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px 10px;margin:4px 0 10px}
textarea{min-height:84px;resize:vertical}
button{font:inherit;background:var(--ac);color:var(--acx);border:0;border-radius:8px;padding:9px 16px;cursor:pointer}
button.g{background:transparent;color:var(--mu);border:1px solid var(--bd)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:0 0 auto}
.in{border-left:3px solid var(--bd);padding:2px 10px;margin:6px 0;white-space:pre-wrap}
.er{color:var(--er)}.ok{color:var(--ac);font-size:14px}
table{border-collapse:collapse;width:100%}td{padding:4px 6px;border-bottom:1px solid var(--bd)}
</style></head><body><main id="app"></main>
<script>
// ______________________________________________________________
const SUPABASE_URL = 'https://lvcgymcfmapbevauozsf.supabase.co';
const ANON_KEY = 'sb_publishable_yMc1Gg0UFECxgtNRemro1w_lbMzVJGX';
// ______________________________________________________________
const app = document.getElementById('app');
async function rpc(fn, args) {
  const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: Object.assign({'Content-Type': 'application/json', apikey: ANON_KEY}, ANON_KEY.startsWith('eyJ') ? {Authorization: 'Bearer ' + ANON_KEY} : {}),
    body: JSON.stringify(args || {})
  });
  const t = await r.text();
  if (!r.ok) { let m = t; try { m = JSON.parse(t).message } catch (e) {} throw new Error(m); }
  return t ? JSON.parse(t) : null;
}
function h(t, p, ...k) {
  const e = document.createElement(t);
  for (const [a, v] of Object.entries(p || {})) { if (a === 'on') for (const [n, f] of Object.entries(v)) e.addEventListener(n, f); else if (a === 'cls') e.className = v; else e[a] = v; }
  for (const c of k) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
const TITLE = 'Frigga-Awards Nominierungen';
const show = (...n) => app.replaceChildren(h('h1', {}, TITLE), ...n);
let sess = null; // {id, code, name, is_mod}

async function loginView() {
  const nm = h('input', {type: 'text', placeholder: 'Dein Name', autocomplete: 'off'});
  const inp = h('input', {type: 'password', inputMode: 'numeric', placeholder: 'Dein Code'});
  const er = h('span', {cls: 'er'});
  const go = async () => {
    try {
      const u = await rpc('login_by_name', {p_name: nm.value, p_code: inp.value.trim()});
      if (!u) { er.textContent = 'Name oder Code stimmt nicht.'; return; }
      sess = {...u, code: inp.value.trim()}; boardView();
    } catch (e) { er.textContent = 'Anmeldung nicht möglich: ' + e.message; }
  };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  show(h('div', {cls: 'card'}, h('h2', {}, 'Anmelden'), nm, inp, h('div', {cls: 'row'}, h('button', {on: {click: go}}, 'Weiter'), er)));
}

async function boardView() {
  let b;
  try { b = await rpc('get_board', {p_id: sess.id, p_code: sess.code}); }
  catch (e) { return show(h('p', {cls: 'er'}, e.message), h('button', {on: {click: () => { sess = null; loginView(); }}}, 'Zurück')); }
  const head = h('div', {cls: 'row'}, h('span', {cls: 'mu'}, 'Angemeldet als ' + sess.name + (sess.is_mod ? ' (Moderator:in)' : '')),
    h('button', {cls: 'g', on: {click: boardView}}, 'Aktualisieren'),
    h('button', {cls: 'g', on: {click: () => { sess = null; loginView(); }}}, 'Abmelden'));
  const cards = b.people.map(t => {
    const ta = h('textarea', {placeholder: 'Deine Idee zu ' + t.name + ' …'}); ta.value = b.mine[t.id] || '';
    const st = h('span', {cls: 'ok'});
    const sv = h('button', {on: {click: async () => {
      try { await rpc('save_entry', {p_id: sess.id, p_code: sess.code, p_target: t.id, p_body: ta.value}); st.textContent = 'Gespeichert.'; }
      catch (e) { st.className = 'er'; st.textContent = 'Fehler: ' + e.message; }
    }}}, 'Speichern');
    const kids = [h('h2', {}, 'Zu: ' + t.name), h('div', {cls: 'mu'}, 'Dein Beitrag'), ta, h('div', {cls: 'row'}, sv, st)];
    if (sess.is_mod) {
      const rest = b.others.filter(o => o.target === t.id);
      kids.push(h('div', {cls: 'mu', style: 'margin-top:14px'}, 'Beiträge der anderen'));
      if (!rest.length) kids.push(h('div', {cls: 'mu'}, 'Noch nichts.'));
      rest.forEach(o => kids.push(h('div', {cls: 'in'}, o.body)));
    }
    return h('div', {cls: 'card'}, ...kids);
  });
  show(head, ...cards);
}

async function adminView() {
  const pw = h('input', {type: 'password', placeholder: 'Admin-Passwort'});
  const er = h('span', {cls: 'er'});
  const go = async () => {
    try { const list = await rpc('admin_get', {p_pw: pw.value}); adminEdit(pw.value, list); }
    catch (e) { er.textContent = e.message; }
  };
  pw.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  show(h('div', {cls: 'card'}, h('h2', {}, 'Verwaltung'), pw, h('div', {cls: 'row'}, h('button', {on: {click: go}}, 'Öffnen'), er)));
}
function adminEdit(pw, list) {
  const ta = h('textarea', {rows: 8, placeholder: 'Eine Person pro Zeile.\nMit * am Ende = Moderator:in\nAnna*\nBen\nCara'});
  ta.value = list.map(p => p.name + (p.is_mod ? '*' : '')).join('\n');
  const msg = h('span', {cls: 'ok'});
  const save = h('button', {on: {click: async () => {
    const l = ta.value.split('\n').map(x => x.trim()).filter(Boolean).map(x => ({name: x.replace(/\*+$/, '').trim(), is_mod: x.endsWith('*')}));
    try { await rpc('admin_save', {p_pw: pw, p_list: l}); const n = await rpc('admin_get', {p_pw: pw}); adminEdit(pw, n); }
    catch (e) { msg.className = 'er'; msg.textContent = e.message; }
  }}}, 'Speichern');
  show(h('div', {cls: 'card'}, h('h2', {}, 'Teilnehmer'), h('p', {cls: 'mu'}, 'Entfernte Personen werden mit allen ihren Beiträgen gelöscht. Codes bleiben für bestehende Namen erhalten.'), ta, h('div', {cls: 'row'}, save, msg)),
    h('div', {cls: 'card'}, h('h2', {}, 'Codes zum Weitergeben'), h('table', {}, ...list.map(p => h('tr', {}, h('td', {}, p.name), h('td', {cls: 'mu'}, p.is_mod ? 'Moderator:in' : 'Teilnehmer:in'), h('td', {}, p.code))))));
}
const route = () => { if (location.hash === '#admin') adminView(); else loginView(); };
window.addEventListener('hashchange', route);
route();
</script></body></html>
